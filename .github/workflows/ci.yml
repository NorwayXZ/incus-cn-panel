name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n bootstrap.sh bootstrap-node.sh install.sh install-node.sh uninstall.sh uninstall-node.sh
      - name: Frontend syntax
        run: awk '/<script>/{flag=1;next}/<\/script>/{flag=0}flag' static/index.html | node --check
      - name: Python tests
        run: python3 -m py_compile app.py && python3 -m unittest discover -s tests -v
