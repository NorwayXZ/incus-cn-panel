name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n bootstrap.sh install.sh uninstall.sh
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
